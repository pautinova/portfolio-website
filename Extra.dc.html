<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    @font-face { font-family: 'Noto Serif'; src: url('./fonts/NotoSerif-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: normal; }
    @font-face { font-family: 'Noto Serif'; src: url('./fonts/NotoSerif-Italic-Variable.ttf') format('truetype-variations'); font-weight: 100 900; font-style: italic; }
    body { margin: 0; background: #ffffff; }
    ::selection { background: #e5e5e5; }
    a { color: #1a1a1a; text-decoration: none; }
    a:hover { color: #737373; }
    @media (pointer: fine) { html, body, a, button, * { cursor: none !important; } }
  </style>
</helmet>

<div style="position:relative; min-height:100vh; overflow:hidden; background:#ffffff; font-family: 'Noto Sans', sans-serif;">
  <div ref="{{ cursorRef }}" style="position:fixed; top:-100px; left:-100px; z-index:9999; pointer-events:none; display:flex; align-items:center; justify-content:center; box-sizing:border-box; width:12px; height:12px; background:#3a3a3a; color:#ffffff; border-radius:999px; overflow:hidden; white-space:nowrap; font-family:'Noto Sans',sans-serif; font-size:10px; font-weight:600; letter-spacing:0.1em; transform:translate(-50%,-50%); transition:width 0.28s cubic-bezier(0.22,1,0.36,1), height 0.28s cubic-bezier(0.22,1,0.36,1);">
    <span ref="{{ cursorLabelRef }}" style="opacity:0; transition:opacity 0.16s ease;"></span>
  </div>


  <nav style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:22px clamp(20px,4vw,48px); border-bottom:1px solid rgba(0,0,0,0.1); position:relative; z-index:1;">
    <a href="./Portfolio.dc.html" style="font-size:13px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b;">TINAY YERNAZAROVA</a>
    <div style="display:flex; align-items:center; gap:clamp(18px,3vw,32px); flex-wrap:wrap;">
      <a href="./Portfolio.dc.html" style="font-size:12px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b;" style-hover="color:#111111;">HOME</a>
      <a href="./Work.dc.html" style="font-size:12px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b;" style-hover="color:#111111;">WORK</a>
      <a href="./Extra.dc.html" style="font-size:12px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b;" style-hover="color:#111111;">EXTRA</a>
      <a href="./About.dc.html" style="font-size:12px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b;" style-hover="color:#111111;">ABOUT</a>
      <a href="https://drive.google.com/file/d/1j8zz_I75VMI7psE7RvNCzcFFe0164exo/view?usp=sharing" target="_blank" rel="noopener" style="font-size:11px; font-weight:600; letter-spacing:0.06em; color:#6b6b6b; border:1px solid rgba(0,0,0,0.35); padding:8px 16px; border-radius:6px;" style-hover="background:#3a3a3a; color:#ffffff; border-color:#3a3a3a;">RESUME</a>
    </div>
  </nav>

  <main style="max-width:1000px; margin:0 auto; padding:clamp(60px,9vw,90px) clamp(20px,4vw,48px) clamp(30px,5vw,50px); position:relative; z-index:1; column-count:2; column-gap:clamp(11px,1.93vw,19px);">

    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <section style="width:100%; break-inside:avoid; margin-bottom:clamp(32px,4.8vw,48px); display:inline-block;">
        <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBTAA7" ref="{{ it.imgRef }}" alt="{{ it.title }}" style="width:100%; height:auto; display:block;">
        <h2 style="margin:20px 0 8px; font-family:'Noto Sans',sans-serif; font-weight:600; text-transform:uppercase; font-size:17px; color:#111111;">{{ it.title }}</h2>
        <p style="margin:0; font-size:12px; line-height:1.6; color:#6b6b6b;">{{ it.desc }}</p>
        <sc-if value="{{ it.href }}" hint-placeholder-val="{{ false }}">
          <a href="{{ it.href }}" target="_blank" rel="noopener" style="display:inline-block; margin-top:10px; font-size:10px; font-weight:600; letter-spacing:0.08em; color:#111111;">LISTEN ON APPLE MUSIC &rarr;</a>
        </sc-if>
      </section>
    </sc-for>
  </main>

  <footer style="position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:clamp(60px,9vw,90px) clamp(20px,4vw,48px) clamp(30px,5vw,50px); display:flex; flex-wrap:wrap; justify-content:space-between; gap:32px;">
    <h2 style="margin:0; font-family:'Noto Serif',serif; font-weight:400; font-size:clamp(28px,4vw,36px); background:linear-gradient(to right, #000000B3, #111111); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;">Let&rsquo;s connect!</h2>
    <div style="display:flex; gap:clamp(30px,6vw,60px); flex-wrap:wrap;">
      <div style="display:flex; flex-direction:column; gap:10px;">
        <a href="./Portfolio.dc.html" style="font-size:13px; color:#111111;">Home</a>
        <a href="./Work.dc.html" style="font-size:13px; color:#111111;">Work</a>
        <a href="./About.dc.html" style="font-size:13px; color:#111111;">About</a>
        <a href="./Extra.dc.html" style="font-size:13px; color:#111111;">Extra</a>
      </div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <a href="https://www.linkedin.com/in/tina-yernazarova/" target="_blank" rel="noopener" style="font-size:13px; color:#111111;">LinkedIn</a>
        <a href="mailto:t.n.yernazarova@gmail.com" style="font-size:13px; color:#111111;">Email</a>
        <a href="https://drive.google.com/file/d/1j8zz_I75VMI7psE7RvNCzcFFe0164exo/view?usp=sharing" target="_blank" rel="noopener" style="font-size:13px; color:#111111;">Resume</a>
      </div>
    </div>
  </footer>

  <div style="position:relative; z-index:1; max-width:1000px; margin:0 auto; padding:0 clamp(20px,4vw,48px) 30px; display:flex; align-items:center; gap:8px; font-size:11px; color:#8a8a8a;">
    <span>Tinay Yernazarova</span>
    <span style="color:#8a8a8a;">&#10023;</span>
    <span>Last updated in August 2026</span>
    <span style="color:#8a8a8a;">&#10023;</span>
    <span>Built with care</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:1600}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.matchMedia || !window.matchMedia('(pointer: fine)').matches) return;
    this._move = (e) => {
      const dot = this._dot, label = this._label;
      if (!dot) return;
      dot.style.left = e.clientX + 'px';
      dot.style.top = e.clientY + 'px';
      const over = e.target && e.target.closest && e.target.closest('[data-cursor-cta]');
      if (over && this._openEl !== over) {
        this._openEl = over;
        const custom = over.getAttribute('data-cursor-label') || 'VIEW \u2192';
        if (label) { label.textContent = custom; label.style.opacity = '1'; }
        dot.style.width = ((label ? label.scrollWidth : 116) + 24) + 'px';
        dot.style.height = '30px';
        dot.style.borderRadius = '6px';
      } else if (!over && this._openEl) {
        this._openEl = null;
        if (label) label.style.opacity = '0';
        dot.style.width = '12px';
        dot.style.height = '12px';
        dot.style.borderRadius = '999px';
      }
    };
    window.addEventListener('mousemove', this._move);
  }
  componentWillUnmount() {
    if (this._move) window.removeEventListener('mousemove', this._move);
  }

  renderVals() {
    return {
      cursorRef: (el) => { this._dot = el; },
      cursorLabelRef: (el) => { this._label = el; },
      items: this._items().map(it => ({
        ...it,
        imgRef: (el) => {
          if (!el) return;
          if (el.src.indexOf(it.src.replace("./", "")) === -1) { try { el.src = it.src; } catch (e) {} }
          el.style.filter = "saturate(" + (it.saturate ?? "1") + ")";
        }
      }))
    };
  }
  _items() {
    return [
        { title: "Popil – Single Cover (2024)", desc: "Single cover designed for my friend Nikita (YTPO). Popil (\u041f\u043e\u043f\u0456\u043b) means \"ashes\" in Ukrainian", src: "./nikita-extra-1.png", href: "https://music.apple.com/us/album/popil-single/1673567666" },
        { title: "Alexandra Trusova (2023)", desc: "A portrait of one of my favourite figure skaters, inspired by her Olympics program", src: "./extra-4.jpg" },
        { title: "Untitled (2024)", desc: "Created while recovering from severe food poisoning that left me bedridden for three weeks", src: "./extra-2.jpg" },
        { title: "Defence (2024)", desc: "Inspired by my favourite book, The Defense by Vladimir Nabokov", src: "./extra-3.jpg" },
        { title: "Exercising (2025)", desc: "Growing up with weak eyesight, my daily \"exercise\" was vision therapy", src: "./extra-5.jpg" },
        { title: "Knitted hat (2026)", desc: "In 2026, I discovered a new obsession: knitting", src: "./extra-6.png", saturate: "0.95" }
      ];
  }
}
</script>
</body>
</html>
